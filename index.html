<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Calculator App</title>
    <!-- Links the style css -->
    <link rel="stylesheet" href="style.css">
 
  </head>  
  <body>
    <div class="wrapper">
        <section class="calculator-screen">
          <div class="history" id="history"></div>
          <div class="display" id="display">0</div>
        </section>
        
        <section class="calculator-buttons">
          <button class="function" data-action="clear">AC</button>
          <button class="function" data-action="sign">+/&minus;</button>
          <button class="function" data-action="percent">%</button>
          <button class="operator" data-operator="/">&divide;</button>
 
          <button data-number="7">7</button>
          <button data-number="8">8</button>
          <button data-number="9">9</button>
          <button class="operator" data-operator="*">&times;</button>
 
          <button data-number="4">4</button>
          <button data-number="5">5</button>
          <button data-number="6">6</button>
          <button class="operator" data-operator="-">&minus;</button>
 
          <button data-number="1">1</button>
          <button data-number="2">2</button>
          <button data-number="3">3</button>
          <button class="operator" data-operator="+">+</button>
 
          <button class="zero" data-number="0">0</button>
          <button data-action="decimal">.</button>
          <button class="equals" data-action="equals">=</button>
        </section>
      </div>
      <!-- Links the script js -->
     <script src="script.js"></script>
  </body>
</html>
